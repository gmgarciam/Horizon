name: Daily Horizon Summary + Telegram

on:
  schedule:
    # Runs every day at 23:00 UTC (7:00 AM Philippine / Hong Kong Time / UTC+8)
    # Adjust to your preferred time: https://crontab.guru/
    - cron: "0 23 * * *"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  generate-and-notify:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout your forked repo ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python + uv (required to run Horizon itself) ────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Horizon dependencies
        run: uv sync

      # ── 3. Set up PHP (for our Telegram sender script) ────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl
          tools: none

      # ── 4. Create .env from secrets ───────────────────────────────────────
      #    Add whichever AI provider key you use; delete the others.
      - name: Write .env file
        run: |
          cat > .env << 'EOF'
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          MANUS_API_KEY=${{ secrets.MANUS_API_KEY }}
          EOF

      # ── 5. Run Horizon to generate the daily summary ──────────────────────
      - name: Generate daily summary
        run: uv run horizon --hours 24

      # ── 6. Send the summary to Telegram via PHP ───────────────────────────
      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: php scripts/send_telegram.php

      # ── 7. (Optional) Commit the generated summary back to the repo ───────
      #    Remove this step if you don't want to store summaries in git.
      - name: Commit summary to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/summaries/
          git diff --cached --quiet || git commit -m "chore: daily summary $(date -u +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
