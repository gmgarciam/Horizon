name: Daily Horizon Summary + Telegram

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  generate-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Horizon dependencies
        run: uv sync

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl
          tools: none

      - name: Write .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "MANUS_API_KEY=${{ secrets.MANUS_API_KEY }}" >> .env

      - name: Generate daily summary
        run: uv run horizon --hours 48

      - name: Send to Telegram
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: php scripts/send_telegram.php

      - name: Commit summary to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/summaries/
          git diff --cached --quiet || git commit -m "chore: daily summary $(date -u +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}